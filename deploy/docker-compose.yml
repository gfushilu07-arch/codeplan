# CodePlan 本地开发依赖(PG/Redis/NATS + 可选 S3)
# 用法:docker compose -f deploy/docker-compose.yml up -d
# 需要本地 S3(MinIO)时:docker compose -f deploy/docker-compose.yml --profile s3 up -d
#
# 说明:MinIO 官方已从 Docker Hub 撤下镜像,默认使用 ghcr.io;
# 若网络不可达,用环境变量覆盖镜像源,如:
#   MINIO_IMAGE=docker.1ms.run/ghcr.io/minio/minio:latest docker compose --profile s3 up -d
# 开发环境存储后端可不经 S3:CODEPLAN_STORAGE_BACKEND=fs(见 storage crate,OpenDAL 统一抽象)。
# 密钥仅用于本地开发,生产部署使用注入的真实密钥(见 PLAN.md 安全规约)

name: codeplan-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeplan
      POSTGRES_USER: codeplan
      POSTGRES_PASSWORD: codeplan-dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeplan -d codeplan"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4223:4222"
      - "8223:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-ghcr.io/minio/minio:latest}
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: codeplan
      MINIO_ROOT_PASSWORD: codeplan-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  natsdata:
  miniodata:
