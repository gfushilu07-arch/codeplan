name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端(fmt/clippy/test/lint-deps/deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy(警告视为错误)
        run: cargo clippy --workspace -- -D warnings

      - name: 测试
        run: cargo test --workspace

      - name: 依赖解耦检查(四层白名单)
        run: cargo run -p xtask -- lint-deps

      - name: AI 规则文件同步检查
        run: |
          cargo run -p xtask -- sync-rules
          if ! git diff --exit-code -- CLAUDE.md .cursor/rules .github/copilot-instructions.md; then
            echo "::error::AGENTS.md 与生成物不同步,请运行: cargo xtask sync-rules"
            exit 1
          fi

      - name: 依赖审计与许可检查(cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2

  frontend:
    name: 前端(lint/test/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: 测试
        working-directory: web
        run: pnpm test

      - name: 构建
        working-directory: web
        run: pnpm build
