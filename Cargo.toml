[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://example.internal/codeplan/codeplan"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
toml = "0.9"
utoipa = { version = "5", features = ["axum_extras"] }
uuid = { version = "1", features = ["v4", "serde"] }

codeplan-common = { path = "crates/common" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
