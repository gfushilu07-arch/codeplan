# cargo-deny 配置:依赖审计 + 许可合规(CI 中经 EmbarkStudios/cargo-deny-action 执行)

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
# 依赖树中出现多版本只警告(起步期生态常见),不阻塞
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"
